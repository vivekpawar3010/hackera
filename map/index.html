<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Location Map</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css" />
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <!-- Custom CSS -->
    <style>
      #map {
        height: 500px;
        width: 100%;
      }
      .custom-background {
        background-color: #f8f9fa; /* Optional: Change background color if needed */
      }
      .navbar-nav {
        margin-left: auto;
      }
    </style>
  </head>
  <body class="custom-background">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <a class="navbar-brand" href="#">City Finder</a>
      <ul class="navbar-nav ml-auto">
        <li class="nav-item">
          <a class="nav-link" href="../Home Page/home.html">Main</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="../Weather/Weather.html">Weather</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="./index.html"
            >Map</a
          >
        </li>
        <li class="nav-item">
          <a class="nav-link" href="../Login/login.html">Login</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="../Register/register.html">Register</a>
        </li>
      </ul>
    </nav>

    <div class="container mt-4">
      <h1>Live Location Map</h1>
      <div class="row g-3 mb-3">
        <div class="col-12 col-md-4">
          <label for="destination" class="form-label">Destination city</label>
          <input id="destination" class="form-control" placeholder="e.g. Pune" />
        </div>
        <div class="col-12 col-md-2 d-flex align-items-end">
          <button id="findDestination" class="btn btn-success w-100">Route to Destination</button>
        </div>
        <div class="col-12 col-md-3">
          <label for="city1" class="form-label">Start city</label>
          <input id="city1" class="form-control" placeholder="e.g. Mumbai" />
        </div>
        <div class="col-12 col-md-3">
          <label for="city2" class="form-label">End city</label>
          <input id="city2" class="form-control" placeholder="e.g. Delhi" />
        </div>
        <div class="col-12 col-md-2 d-md-none"></div>
        <div class="col-12 col-md-2 d-flex align-items-end">
          <button id="findDistance" class="btn btn-outline-primary w-100">Find Route Between Cities</button>
        </div>
        <div class="col-12 col-md-2 d-flex align-items-end">
          <button id="find" class="btn btn-primary w-100">Find My Location</button>
        </div>
      </div>
      <div id="map"></div>
    </div>

    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <!-- Custom JavaScript -->
    <script src="script.js"></script>
  </body>
</html>
